events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Use Docker's internal DNS resolver so upstream names resolve at request time
    # (prevents nginx from crashing if a container isn't up yet at start)
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # API → Python backend
        location /api/ {
            set $backend_host backend:8000;
            proxy_pass http://$backend_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # Uploaded files → backend static
        location /uploads/ {
            set $backend_host backend:8000;
            proxy_pass http://$backend_host;
            proxy_set_header Host $host;
        }

        # Vision service
        location /vision/ {
            set $vision_host vision:8001;
            rewrite ^/vision/(.*) /$1 break;
            proxy_pass http://$vision_host;
            proxy_set_header Host $host;
        }

        # Frontend dev server (everything else)
        location / {
            set $frontend_host frontend:3000;
            proxy_pass http://$frontend_host;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }
    }
}
