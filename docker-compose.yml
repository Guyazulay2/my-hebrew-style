version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mystylist
      POSTGRES_USER: mystylist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mystylist_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystylist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./services/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://mystylist:${POSTGRES_PASSWORD:-mystylist_dev}@db:5432/mystylist
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: .
    environment:
      VITE_API_URL: ""
    depends_on:
      - backend

  vision:
    build: ./services/vision
    depends_on:
      - backend

  nginx:
    build: ./services/nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pg_data:
  uploads:
